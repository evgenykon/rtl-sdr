services:
  rtl-web:
    build: .
    container_name: rtl-sdr-web
    ports:
      - "8080:8080"
    environment:
      RTL_TCP_HOST: host.docker.internal
      RTL_TCP_PORT: "1234"
      RTL_AGENT_URL: http://host.docker.internal:5055
      RTL_AGENT_TOKEN_FILE: /config/agent-token
    volumes:
      - ${HOME}/.rtl-sdr:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
